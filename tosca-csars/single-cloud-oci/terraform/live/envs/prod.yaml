# Production Environment Configuration
# Generated by external tool (optimizer)

# ============================================
# Cloud Provider Selection
# ============================================
clouds:
  aws: true
  gcp: true
  oci: true

# ============================================
# AWS Configuration
# ============================================
aws:
  region: us-west-2
  vpc_id: "vpc-REPLACE_WITH_VPC_ID"
  private_subnet_ids:
    - "subnet-REPLACE_WITH_SUBNET_ID_1"
    - "subnet-REPLACE_WITH_SUBNET_ID_2"
  cluster_role_arn: "arn:aws:iam::REPLACE_WITH_ACCOUNT_ID:role/eks-cluster-role"
  node_role_arn: "arn:aws:iam::REPLACE_WITH_ACCOUNT_ID:role/eks-node-role"

# ============================================
# GCP Configuration
# ============================================
gcp:
  region: us-central1
  project_id: "REPLACE_WITH_PROJECT_ID"
  vpc_name: "k8s-platform-vpc-prod"
  private_subnet_ids:
    - "https://www.googleapis.com/compute/v1/projects/REPLACE_WITH_PROJECT_ID/regions/us-central1/subnetworks/k8s-platform-private-prod"

# ============================================
# OCI Configuration
# ============================================
oci:
  region: sa-saopaulo-1
  compartment_ocid: "ocid1.compartment.oc1..REPLACE_WITH_COMPARTMENT_ID"

# ============================================
# Cluster Configuration
# ============================================
cluster:
  name: k8s-prod
  kubernetes_version: "1.31"

# ============================================
# Node Pools - Separated by Provider
# ============================================
node_pools:

  # ──────────────────────────────────────────
  # AWS EKS Node Groups
  # ──────────────────────────────────────────
  aws:
    - name: c5-2xlarge-pool
      instance_type: c5.2xlarge
      count: 4
      capacity_type: ON_DEMAND
      labels:
        workload: compute
        cloud: aws
        environment: prod
      taints: []

  # ──────────────────────────────────────────
  # GCP GKE Node Pools
  # ──────────────────────────────────────────
  gcp:
    - name: e2-standard-16-pool
      machine_type: e2-standard-16
      count: 3
      disk_size_gb: 100
      disk_type: pd-ssd
      labels:
        workload: compute
        cloud: gcp
        environment: prod
      taints: []

  # ──────────────────────────────────────────
  # OCI OKE Node Pools
  # ──────────────────────────────────────────
  oci:
    - name: general
      instance_type: VM.Standard.A1.Flex
      count: 3
      availability_domain: "REPLACE_WITH_AVAILABILITY_DOMAIN"
      memory_gb: 32
      ocpus: 8
      source_type: IMAGE
      image_id: "REPLACE_WITH_IMAGE_OCID"
      labels:
        workload: general
        cloud: oci
        environment: prod
      taints: []

# ============================================
# Tags
# ============================================
tags:
  CostCenter: platform
  Owner: devops
  ManagedBy: Terraform
  Environment: prod
  Project: k8s-platform
