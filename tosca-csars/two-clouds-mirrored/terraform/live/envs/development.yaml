# Environment Configuration Template
# Generated by external tool (optimizer) for each environment
# Each environment can have N node pools per cloud provider

# ============================================
# Cloud Provider Selection
# ============================================
clouds:
  aws: false    # Enable/disable AWS
  gcp: true    # Enable/disable GCP
  oci: true    # Enable/disable OCI


# ============================================
# GCP Configuration
# ============================================
gcp:
  region: us-east1
  project_id: "project_id" # Omitted for security reasons, must be set in environment variables or Terraform variables
  vpc_name: "vpck8s"
  private_subnet_ids: []
  
  # Network configuration
  subnet_cidr: "10.0.0.0/20"
  
  # Secondary IP ranges for GKE pods and services
  # If omitted, auto-calculated from subnet_cidr:
  #   pods = cidrsubnet(subnet_cidr, 4, 2)      # 10.0.32.0/16
  #   services = cidrsubnet(subnet_cidr, 2, 3)  # 10.0.192.0/18
  secondary_ranges:
    pods: "10.4.0.0/14"         # ≈1M IPs for pods
    services: "10.8.0.0/20"     # ≈4K IPs for services
  
  # Master network configuration (required for private cluster)
  master_ipv4_cidr: "172.16.0.0/28"
  
  # Access to GKE master endpoint (required for kubectl deployments)
  # Use "0.0.0.0/0" for development, restrict to specific IPs in production
  master_authorized_networks:
    - cidr_block: "0.0.0.0/0"
      display_name: "all-access"

# ============================================
# OCI Configuration
# ============================================
oci:
  region: sa-saopaulo-1
  compartment_ocid: "ocid1.compartment.oc1...." # Omitted for security reasons, must be set in environment variables or Terraform variables

# ============================================
# Cluster Configuration (shared)
# ============================================
cluster:
  name: project1-development
  kubernetes_version: "v1.36.0"
  private_endpoint: false  # false = master accessible externally (for development)
  
  # Node locations (empty = all zones in region)
  # For development: use single zone to reduce cost
  # For production: use multiple zones or leave empty for HA
  node_locations:
    - "us-east1-b"  # Single zone = 1 node (with node_count=1)

# ============================================
# Node Pools - Separated by Provider
# ============================================
node_pools:


  # ──────────────────────────────────────────
  # GCP GKE Node Pools
  # ──────────────────────────────────────────
  gcp:
    - name: e2-standard-8-pool
      machine_type: e2-standard-8            # Required
      count: 1                               # Required
      disk_size_gb: 100                      # Default: 100
      disk_type: pd-standard                 # Default: pd-standard | pd-ssd | pd-balanced
      labels:
        workload: compute
        cloud: gcp
      taints: []
      # - key: "workload"
      #   value: "dedicated"
      #   effect: "NO_SCHEDULE"

  # ──────────────────────────────────────────
  # OCI OKE Node Pools
  # ──────────────────────────────────────────
  oci:
    - name: general
      instance_type: VM.Standard.A1.Flex     # Required (shape name)
      count: 1                               # Required
      availability_domain: "JvzU:SA-SAOPAULO-1-AD-1"                # Required - optimizer fills
      memory_gb: 16                          # Default: null (uses shape default)
      ocpus: 4                               # Default: null (uses shape default)
      source_type: IMAGE                     # Default: OKE | IMAGE
      image_id: "ocid1.image.oc1.sa-saopaulo-1.aaaaaaaaksco7gh4elaxo6jlh2zv3naoudzioyfsh6goygqn7m4cnbjij3ma"                           # Required if source_type=IMAGE
      node_image_id: "ocid1.image.oc1.sa-saopaulo-1.aaaaaaaaksco7gh4elaxo6jlh2zv3naoudzioyfsh6goygqn7m4cnbjij3ma"                           # Required if source_type=IMAGE
      labels:
        workload: general
        cloud: oci
      taints: []
      # - key: "workload"
      #   value: "dedicated"
      #   effect: "NO_SCHEDULE"

# ============================================
# Tags (shared across all resources)
# ============================================
tags:
  costcenter: platform
  owner: devops
  managedby: terraform
  environment: development
  project: projectname

